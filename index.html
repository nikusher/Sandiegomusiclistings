<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>San Diego Live Music</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17202a;background:#f5f6f8}
body{margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}
h1{margin:0 0 4px;font-size:clamp(24px,5vw,38px)}.muted{color:#68717b}
.controls{position:sticky;top:0;background:#f5f6f8ee;backdrop-filter:blur(10px);padding:12px 0;z-index:2}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
input,select,button{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd1d6;border-radius:10px;background:white;font:inherit}
button{cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:14px}
.card{background:white;border:1px solid #e1e4e8;border-radius:14px;padding:14px;box-shadow:0 2px 8px #0000000a}
.date{font-weight:800;font-size:14px}.venue{font-weight:700;margin-top:4px}.show{font-size:18px;font-weight:750;margin:8px 0}.meta{font-size:13px;line-height:1.5;color:#4f5963}
.badge{display:inline-block;border-radius:999px;padding:3px 8px;background:#eef1f4;margin:3px 3px 0 0;font-size:12px}
.empty{padding:30px;text-align:center;color:#68717b}.small{font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<h1>San Diego Live Music</h1>
<div class="muted">Aug 18–Sep 30, 2026 • sortable, mobile-friendly master list</div>
<div class="controls">
<div class="grid">
<input id="q" placeholder="Search artist or show">
<select id="venue"><option value="">All venues</option></select>
<select id="genre"><option value="">All genres</option></select>
<select id="sort"><option value="date">Date</option><option value="venue">Venue</option><option value="genre">Genre</option><option value="show">Artist / show</option></select>
<button id="csv">Export CSV</button>
</div></div>
<div id="count" class="small muted"></div>
<div id="cards" class="cards"></div>
</div>
<script>
const DATA_URL="data/concerts.csv";
let rows=[];
function parseCSV(s){const out=[];let row=[],cell="",q=false;for(let i=0;i<s.length;i++){const c=s[i],n=s[i+1];if(c=='"'&&q&&n=='"'){cell+='"';i++;continue}if(c=='"'){q=!q;continue}if(c==','&&!q){row.push(cell);cell="";continue}if((c=='\n'||c=='\r')&&!q){if(c=='\r'&&n=='\n')i++;row.push(cell);if(row.some(x=>x.trim()))out.push(row);row=[];cell="";continue}cell+=c}if(cell||row.length){row.push(cell);out.push(row)}return out}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function render(){let f=rows.filter(r=>{let q=document.querySelector("#q").value.toLowerCase(),v=document.querySelector("#venue").value,g=document.querySelector("#genre").value;return(!q||(r.show+" "+r.venue+" "+r.genre).toLowerCase().includes(q))&&(!v||r.venue==v)&&(!g||r.genre==g)});let s=document.querySelector("#sort").value;f.sort((a,b)=>s=="date"?a.iso.localeCompare(b.iso)||a.venue.localeCompare(b.venue):s=="venue"?a.venue.localeCompare(b.venue)||a.iso.localeCompare(b.iso):s=="genre"?a.genre.localeCompare(b.genre)||a.iso.localeCompare(b.iso):a.show.localeCompare(b.show));document.querySelector("#count").textContent=`${f.length} listings`;document.querySelector("#cards").innerHTML=f.length?f.map(r=>`<article class="card"><div class="date">${esc(r.date)}</div><div class="venue">${esc(r.venue)}</div><div class="show">${esc(r.show)}</div><div class="meta">${esc(r.time)}<br>${esc(r.location)}<br>${r.genre?`<span class="badge">${esc(r.genre)}</span>`:""} ${r.price?`<span class="badge">${esc(r.price)}</span>`:""}</div></article>`).join(""):`<div class="empty">No listings match those filters.</div>`}
fetch(DATA_URL).then(r=>r.text()).then(t=>{let a=parseCSV(t);let h=a.shift();rows=a.map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]||""])));let venues=[...new Set(rows.map(r=>r.venue))].sort(),genres=[...new Set(rows.map(r=>r.genre).filter(Boolean))].sort();venues.forEach(v=>venue.insertAdjacentHTML("beforeend",`<option>${esc(v)}</option>`));genres.forEach(g=>genre.insertAdjacentHTML("beforeend",`<option>${esc(g)}</option>`));render()});
document.querySelectorAll("input,select").forEach(x=>x.addEventListener("input",render));
document.querySelector("#csv").onclick=()=>{const blob=new Blob([document.querySelector("#q").value?rows.map(r=>Object.values(r).map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n"):""],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="san-diego-concerts.csv";a.click()}
</script>
</body></html>
